<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bohr-modellen — Spektrallinjer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#030810; --bg1:#060e18; --bg2:#0a1622; --bg3:#0f1e2d;
  --border:#1a3a52;
  --green:#00ff9f; --cyan:#00cfff; --yellow:#ffd93d; --red:#ff4466;
  --text:#d0eef5; --dim:#8ec8d8;
  --font:'Courier New','Lucida Console',monospace;
  --tr:0.15s ease;
}
[data-theme="light"]{
  --bg0:#e8e0d2; --bg1:#f4eee3; --bg2:#fdfaf4; --bg3:#fdfaf4;
  --border:#d6cbb8;
  --green:#1D9E75; --cyan:#378ADD; --yellow:#c07800; --red:#c0306a;
  --text:#1a1a1a; --dim:#333333;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  padding:16px;
  background:var(--bg0); color:var(--text);
  font-family:var(--font);
  min-height:100vh;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px; max-width:1200px; margin-left:auto; margin-right:auto;
  gap:12px; flex-wrap:wrap;
}
.title-wrap{ display:flex; align-items:center; gap:10px; }
.atom-icon{
  width:24px; height:24px; color:var(--green); display:inline-flex;
  animation:apulse 2.5s ease-in-out infinite; flex-shrink:0;
}
.atom-icon svg{ display:block; width:100%; height:100%; }
@keyframes apulse{
  0%,100%{ opacity:1;   filter:drop-shadow(0 0 6px var(--green)); }
  50%    { opacity:.55; filter:none; }
}
[data-theme="light"] .atom-icon{ animation:apulse-l 2.5s ease-in-out infinite; }
@keyframes apulse-l{
  0%,100%{ opacity:1; }
  50%    { opacity:.55; }
}
h1{
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size:15px; letter-spacing:.20em; text-transform:uppercase;
  margin:0;
  text-shadow:0 0 8px rgba(0,255,159,0.35);
}
[data-theme="light"] h1{ text-shadow:none; }
.h-green{ color:var(--green); }
.h-cyan { color:var(--cyan); }
.h-dash { color:var(--green); margin:0 .18em; }
.header-btns{ display:flex; gap:8px; }
.btn-util{
  background:var(--bg2); color:var(--dim);
  border:1px solid var(--dim);
  padding:7px 14px; font-family:var(--font); font-size:.8rem;
  cursor:pointer; transition:var(--tr); font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
}
.btn-util:hover{
  border-color:var(--green); color:var(--green);
  box-shadow:0 0 8px var(--green);
}
[data-theme="light"] .btn-util:hover{ box-shadow:none; }

/* ── Main grid ──────────────────────────────────────────────────────────── */
main{
  display:grid; gap:14px;
  grid-template-columns:1fr;
  max-width:1200px; margin:0 auto;
}
.row{ display:grid; gap:14px; }
.row.split{ grid-template-columns:320px 1fr; align-items:start; }
.left-col{ display:flex; flex-direction:column; gap:14px; }
.right-col{ display:flex; flex-direction:column; gap:14px; }

.box{
  background:var(--bg1); border:1px solid var(--border);
  border-radius:6px; padding:14px;
}
.sec-title{
  color:var(--green); font-weight:700;
  letter-spacing:.22em; text-transform:uppercase;
  font-size:.78rem; padding-bottom:6px; margin-bottom:12px;
  border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:baseline;
}
.sec-title .st-info{
  color:var(--dim); font-weight:700; letter-spacing:.08em;
  text-transform:none; font-size:.72rem;
}
[data-theme="light"] .sec-title .st-info{ color:#1a1a1a; }

/* ── Controls ───────────────────────────────────────────────────────────── */
.ctrl{ margin-bottom:14px; }
.ctrl:last-child{ margin-bottom:0; }
.ctrl-row{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:6px; gap:6px;
}
.ctrl-label{ color:var(--dim); font-size:.85rem; font-weight:700; }
[data-theme="light"] .ctrl-label{ color:#1a1a1a; }
.ctrl-val{
  color:var(--cyan); font-weight:700;
  font-size:.95rem; font-family:'Courier New',monospace;
  white-space:nowrap;
}
.ctrl-val .ev{ color:var(--green); margin-left:8px; }

input[type=range]{
  width:100%; -webkit-appearance:none; background:transparent;
  margin:4px 0; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:6px; background:var(--bg3); border-radius:3px;
  border:1px solid var(--border);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
  background:var(--cyan); margin-top:-7px; cursor:pointer;
  border:2px solid var(--bg0);
}
input[type=range]::-moz-range-track{
  height:6px; background:var(--bg3); border-radius:3px;
  border:1px solid var(--border);
}
input[type=range]::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%;
  background:var(--cyan); cursor:pointer; border:2px solid var(--bg0);
}

/* Small selection buttons (n=1..6) */
.btn-grp{ display:flex; gap:4px; flex-wrap:wrap; }
.btn-sm{
  flex:1; min-width:38px;
  background:var(--bg3); color:var(--text);
  border:1px solid var(--border);
  padding:7px 4px; font-family:var(--font); font-size:.82rem;
  cursor:pointer; transition:var(--tr); font-weight:700;
  letter-spacing:.03em;
}
.btn-sm:hover{ background:var(--bg2); }
.btn-sm.active{
  background:var(--cyan); color:var(--bg0);
  border-color:var(--cyan);
}
[data-theme="light"] .btn-sm{ color:#1a1a1a; }
[data-theme="light"] .btn-sm.active{ color:#fff; }

/* Big action buttons */
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.btn-big{
  flex:1; min-width:90px;
  background:var(--green); color:var(--bg0);
  border:none; padding:10px 12px;
  font-family:var(--font); font-size:.85rem; font-weight:700;
  cursor:pointer; transition:var(--tr); letter-spacing:.08em;
  text-transform:uppercase;
}
.btn-big:hover:not(:disabled){ filter:brightness(1.12); }
.btn-big:disabled{ opacity:.35; cursor:not-allowed; }
.btn-big.reset  { background:var(--yellow); }
.btn-big.clear  { background:var(--cyan);  }
[data-theme="light"] .btn-big{ color:#fff; }

/* Status + match badge */
.status-box{
  background:var(--bg2); border:1px solid var(--border);
  border-radius:4px; padding:8px 10px; margin-top:2px;
}
.status-txt{
  font-size:.82rem; color:var(--text); line-height:1.4;
  min-height:1.6em;
}
[data-theme="light"] .status-txt{ color:#1a1a1a; }
.badge{
  display:inline-block;
  font-size:.72rem; letter-spacing:.08em; padding:3px 9px;
  border:1px solid; border-radius:3px;
  font-weight:700;
  margin-top:6px;
}
.b-yes{ border-color:var(--green); color:var(--green); background:rgba(0,255,159,.08); }
.b-no { border-color:var(--red);   color:var(--red);   background:rgba(255,68,102,.08); }
.b-ion{ border-color:var(--yellow);color:var(--yellow);background:rgba(255,217,61,.10); }
[data-theme="light"] .b-yes{ background:rgba(29,158,117,.10); }
[data-theme="light"] .b-no { background:rgba(192,48,106,.10); }
[data-theme="light"] .b-ion{ background:rgba(192,120,0,.12); }

/* ── Visualization box ──────────────────────────────────────────────────── */
.viz-row{
  display:grid; grid-template-columns:1fr 260px; gap:12px;
  margin-bottom:14px;
}
canvas{ display:block; width:100%; background:var(--bg1); border:1px solid var(--border); border-radius:4px; }

/* ── Emission log (HTML text — crisp!) ──────────────────────────────────── */
.log-area{
  background:var(--bg2); border:1px solid var(--border);
  border-radius:4px; padding:12px 14px;
  min-height:80px;
  font-family:'Courier New',monospace;
}
.log-empty{
  color:var(--dim); font-size:.85rem; font-style:italic;
  line-height:1.5;
}
[data-theme="light"] .log-empty{ color:#333; font-style:italic; font-weight:700; }
.log-line{
  display:grid;
  grid-template-columns: 72px 1fr;
  gap:8px; align-items:baseline;
  font-size:.92rem; font-weight:700;
  line-height:1.75; letter-spacing:.02em;
}
.log-line span{ white-space:nowrap; }
.log-transition{ text-align:left; }
.log-energy   { text-align:left; }
.log-divider{
  height:1px; background:var(--border);
  margin:8px 0;
}
.log-sum{
  font-size:.88rem; font-weight:700;
  line-height:1.6; color:var(--text);
  overflow-wrap:break-word;
  margin-bottom:3px;
}
.log-sum .lbl{ color:var(--dim); margin-right:4px; }
[data-theme="light"] .log-sum .lbl{ color:#1a1a1a; }
.log-check{
  display:inline-block;
  color:var(--green); margin-left:8px;
  text-shadow:0 0 8px rgba(0,255,159,.5);
  animation:checkfade .5s ease-in;
}
[data-theme="light"] .log-check{ text-shadow:none; }
@keyframes checkfade{
  from{ opacity:0; transform:translateX(-6px); }
  to  { opacity:1; transform:translateX(0); }
}

/* ── Spectrum ───────────────────────────────────────────────────────────── */
#specBox.hide{ display:none; }
.spec-wrap{
  position:relative;
}
#specCanvas{
  width:100%; height:60px;
  background:#000; border:1px solid var(--border);
  border-radius:4px;
}
[data-theme="light"] #specCanvas{ background:#141414; }

/* ── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width:900px){
  .row.split{ grid-template-columns:1fr; }
  .viz-row  { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<header>
  <div class="title-wrap">
    <span class="atom-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="acloud" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="currentColor" stop-opacity="0.55"/>
            <stop offset="55%"  stop-color="currentColor" stop-opacity="0.20"/>
            <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="12" cy="12" r="9" fill="url(#acloud)"/>
        <ellipse cx="12" cy="12" rx="10.5" ry="3.4" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.7"/>
        <ellipse cx="12" cy="12" rx="3.4" ry="10.5" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.7"/>
        <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
      </svg>
    </span>
    <h1><span class="h-green">BOHR-MODELLEN</span><span class="h-dash">—</span><span class="h-cyan">SPEKTRALLINJER</span></h1>
  </div>
  <div class="header-btns">
    <button class="btn-util" id="copyBtn">Kopier kode</button>
    <button class="btn-util" id="themeBtn">Lyst tema</button>
  </div>
</header>

<main>
  <div class="row split">

    <!-- ═══ LEFT: Controls + Emissions log ═══ -->
    <div class="left-col">
      <div class="box">
        <div class="sec-title">Indstillinger</div>

        <div class="ctrl">
          <div class="ctrl-row">
            <span class="ctrl-label">Starttilstand</span>
          </div>
          <div class="btn-grp" id="nBtns">
            <button class="btn-sm active" data-n="1">n=1</button>
            <button class="btn-sm"        data-n="2">n=2</button>
            <button class="btn-sm"        data-n="3">n=3</button>
            <button class="btn-sm"        data-n="4">n=4</button>
            <button class="btn-sm"        data-n="5">n=5</button>
            <button class="btn-sm"        data-n="6">n=6</button>
          </div>
        </div>

        <div class="ctrl">
          <div class="ctrl-row">
            <span class="ctrl-label">Bølgelængde</span>
            <span class="ctrl-val"><span id="wlv">121.6</span> nm<span class="ev"><span id="ev">10.20</span> eV</span></span>
          </div>
          <input type="range" id="sl" min="90" max="700" step="0.1" value="121.6">
        </div>

        <div class="ctrl">
          <div class="status-box">
            <div class="status-txt" id="stTxt">Klar — vælg bølgelængde og klik Afspil.</div>
            <span class="badge b-no" id="badge">Ingen match</span>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn-big"       id="playBtn">▶ Afspil</button>
          <button class="btn-big reset" id="resetBtn">↺ Nulstil</button>
        </div>
        <div class="btn-row">
          <button class="btn-big clear" id="clearBtn" disabled>✕ Ryd spektrum</button>
        </div>
      </div>

      <div class="box">
        <div class="sec-title">
          Emitterede fotoner
          <span class="st-info" id="logStateInfo">— venter</span>
        </div>
        <div class="log-area" id="logArea">
          <div class="log-empty">Ingen emissioner endnu. Vælg en resonans-bølgelængde (fx 121,6 nm for n=1→2) og tryk Afspil.</div>
        </div>
      </div>
    </div>

    <!-- ═══ RIGHT: Atom + Energy diagram, and Spectrum bar ═══ -->
    <div class="right-col">
      <div class="box">
        <div class="viz-row">
          <canvas id="aC"></canvas>
          <canvas id="eC"></canvas>
        </div>
      </div>
      <div class="box hide" id="specBox">
        <div class="sec-title">
          Akkumuleret spektrum
          <span class="st-info" id="specTag">0 fotoner</span>
        </div>
        <div class="spec-wrap">
          <canvas id="specCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

</main>

<script>
'use strict';

// ── DOM ───────────────────────────────────────────────────────────────────
const aEl = document.getElementById('aC');
const eEl = document.getElementById('eC');
const specEl = document.getElementById('specCanvas');

// ── DPR-aware canvas init (crisp text on retina) ─────────────────────────
function initCanvas(canvas, cssW, cssH) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  return ctx;
}

// Logical (CSS) canvas sizes
const AW = 540, AH = 490;
const EW = 260, EH = 490;
const SPEC_W = 1140, SPEC_H = 60;

// Compute atom canvas actual width based on layout so it can flex properly.
// We set width via layout, then set bitmap+scale on load.
function resizeCanvases() {
  const doOne = (canvas, minW, cssH, ctxKey) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 10) return;   // hidden or not laid out yet
    const cssW = Math.max(minW, Math.floor(rect.width));
    canvas.__logicalW = cssW;
    window[ctxKey] = initCanvasFlex(canvas, cssW, cssH);
  };
  doOne(aEl,    300, AH,      '__ac');
  doOne(eEl,    220, EH,      '__ec');
  doOne(specEl, 600, SPEC_H,  '__sc');
}
function initCanvasFlex(canvas, cssW, cssH) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

// Logical drawing dimensions (updated on resize)
function getAW(){ return aEl.__logicalW || AW; }
function getAH(){ return AH; }
function getEW(){ return eEl.__logicalW || EW; }
function getEH(){ return EH; }
function getSW(){ return specEl.__logicalW || SPEC_W; }
function getSH(){ return SPEC_H; }

// ── Physics ───────────────────────────────────────────────────────────────
const HC = 1240;                          // eV·nm
const En = n => -13.6 / (n * n);
const ionE = n => Math.abs(En(n));

function calcAbsTrans(fromN) {
  const res = [];
  for (let hi = fromN + 1; hi <= 6; hi++) {
    const dE = En(hi) - En(fromN);
    res.push({ lo: fromN, hi, dE, lam: HC / dE });
  }
  return res;
}
let absTransitions = calcAbsTrans(1);

function findAbs(lam) {
  for (const t of absTransitions)
    if (Math.abs(lam - t.lam) / t.lam < 0.005) return t;
  return null;
}

// Wavelength → color.
function wlCol(nm) {
  if (dark) {
    if (nm < 380) return '#dde6ff';
    if (nm < 425) return '#9040ff';
    if (nm < 460) return '#5060ff';
    if (nm < 500) return '#2090ff';
    if (nm < 520) return '#00ccdd';
    if (nm < 560) return '#00cc55';
    if (nm < 590) return '#aacc00';
    if (nm < 620) return '#ffaa00';
    if (nm < 700) return '#ff2222';
    return '#b8b8b8';
  } else {
    if (nm < 380) return '#3a4880';
    if (nm < 425) return '#5030b0';
    if (nm < 460) return '#3030a0';
    if (nm < 500) return '#205090';
    if (nm < 520) return '#107070';
    if (nm < 560) return '#1D9E75';
    if (nm < 590) return '#7a8800';
    if (nm < 620) return '#a05000';
    if (nm < 700) return '#b00010';
    return '#707070';
  }
}
const seriesName = lo => (['','Lyman','Balmer','Paschen','Brackett','Pfund'][lo]||'');

// ── State ─────────────────────────────────────────────────────────────────
let dark = true;
let startN = 1;
let ss = 'READY';
let eN = 1;
let pX = 0, pCol = '#00cfff';
let matched = false, tgtN = 1, pendingIon = false;
let dPath = [], dStep = 0;
let flash = 0, tmr = 0;
let decayWait = 0;
let selWL = 121.6;
let paused = false;
let ePh = [], elog = [];
let lastTs = 0;
let ionAngle = 0, ionProgress = 0;
let ionBallX = 0, ionBallY = 0;
let absorbedE = 0;
let hoverN = null;

// Atom center — recomputed each frame from current logical AW/AH
function CX(){ return getAW() * 0.50; }
function CY(){ return getAH() * 0.50; }
const R = n => 34 * n;

// ── Spectrum accumulator ─────────────────────────────────────────────────
const spectrum = new Map();
let totalPhotons = 0;

function recordEmission(lam) {
  if (lam < 80 || lam > 2000) return;
  const key = Math.round(lam);
  spectrum.set(key, (spectrum.get(key) || 0) + 1);
  totalPhotons++;
  if (document.getElementById('specBox').classList.contains('hide')) {
    activateSpectrumView();
  }
  document.getElementById('clearBtn').disabled = false;
}
function activateSpectrumView() {
  document.getElementById('specBox').classList.remove('hide');
  requestAnimationFrame(resizeCanvases);
}
function clearSpectrum() {
  spectrum.clear();
  totalPhotons = 0;
  document.getElementById('specBox').classList.add('hide');
  document.getElementById('clearBtn').disabled = true;
  drawSpectrum();
}

// ── Electron cloud ────────────────────────────────────────────────────────
let lastCloudN = -1;
let cloudRings = [];
function buildCloud(n) {
  if (n === lastCloudN) return;
  lastCloudN = n;
  cloudRings = [];
  const r0 = R(n);
  const sigma = 5 + n * 2.8;
  const rMin = Math.max(2, r0 - sigma * 3.2);
  const rMax = r0 + sigma * 3.2;
  const steps = 180;
  for (let i = 0; i <= steps; i++) {
    const r = rMin + (rMax - rMin) * i / steps;
    const dr = r - r0;
    const density = Math.exp(-(dr * dr) / (2 * sigma * sigma));
    cloudRings.push({ r, alpha: density });
  }
}
function drawCloudAt(ctx, cx, cy, t, fadeAlpha) {
  ctx.save();
  const peakAlpha = dark ? 0.38 : 0.28;
  for (const ring of cloudRings) {
    ctx.globalAlpha = ring.alpha * peakAlpha * fadeAlpha;
    ctx.strokeStyle = t.eCol;
    ctx.lineWidth = 1;
    if (dark) { ctx.shadowColor = t.eCol; ctx.shadowBlur = 2 + ring.alpha * 5; }
    ctx.beginPath();
    ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// ── Theme (canvas colors) ─────────────────────────────────────────────────
const T = () => dark ? {
  bg:'#060e18',
  grid:'rgba(29,58,82,.55)',
  orb:'rgba(0,207,255,.18)', orbHi:'rgba(0,207,255,.55)',
  nuc:'#ff6600', nucGlow:'#ff4400',
  eCol:'#00cfff', eSh:'#00cfff',
  tx:'#eaf6fa',
  tx2:'#ffffff',
  tick:'#bfe2ef',
  dim:'#8ec8d8',
  ac:'#00cfff',
  green:'#00ff9f',
  axis:'#5a7a90',
  wire:'#3a6a88',
  corner:'rgba(0,207,255,.20)',
} : {
  bg:'#f4eee3',
  grid:'rgba(214,203,184,.85)',
  orb:'rgba(55,138,221,.20)', orbHi:'rgba(55,138,221,.70)',
  nuc:'#bf4020', nucGlow:'#902010',
  eCol:'#378ADD', eSh:'#378ADD',
  tx:'#111111',
  tx2:'#000000',
  tick:'#1a1a1a',
  dim:'#444444',
  ac:'#378ADD',
  green:'#1D9E75',
  axis:'#888888',
  wire:'#888888',
  corner:'rgba(55,138,221,.30)',
};

// ── Non-linear energy → y mapping ─────────────────────────────────────────
const EPS = 0.20;
const LOG_MAX = Math.log(13.6 / EPS + 1);
function e2y(e, PB, PH) {
  const be = Math.max(0, -e);
  const frac = 1 - Math.log(be / EPS + 1) / LOG_MAX;
  return PB - Math.max(0, Math.min(1, frac)) * PH;
}

// ── Draw helpers ──────────────────────────────────────────────────────────
function drawGrid(ctx, w, h) {
  ctx.strokeStyle = T().grid; ctx.lineWidth = 1; const s = 40;
  for (let x = s; x < w; x += s) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for (let y = s; y < h; y += s) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
}
function glw(ctx, col, b) {
  if (!dark) { ctx.shadowBlur = 0; return; }
  ctx.shadowColor = col; ctx.shadowBlur = b;
}
function noglw(ctx) { ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
function corners(ctx, w, h, sz) {
  ctx.strokeStyle = T().corner;
  ctx.lineWidth = 1;
  [[0,0,1,1],[w,0,-1,1],[0,h,1,-1],[w,h,-1,-1]].forEach(([cx,cy,sx,sy]) => {
    ctx.beginPath(); ctx.moveTo(cx+sx*sz,cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+sy*sz); ctx.stroke();
  });
}
function waveArrow(ctx, x1, y1, x2, y2, col, amp) {
  amp = amp || 7;
  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  if (len < 5) return;
  const ux=dx/len, uy=dy/len, nx=-uy, ny=ux, wl=17;
  ctx.strokeStyle = col; ctx.lineWidth = 2; glw(ctx, col, 10);
  ctx.beginPath();
  const st = Math.ceil(len);
  for (let i=0; i<=st; i++) {
    const d=(i/st)*len, w=amp*Math.sin(2*Math.PI*d/wl);
    if (i===0) ctx.moveTo(x1+d*ux+w*nx, y1+d*uy+w*ny);
    else        ctx.lineTo(x1+d*ux+w*nx, y1+d*uy+w*ny);
  }
  ctx.stroke();
  const as=9, hx=x2-as*ux, hy=y2-as*uy;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x2,y2); ctx.lineTo(hx+as*.45*nx,hy+as*.45*ny); ctx.lineTo(hx-as*.45*nx,hy-as*.45*ny);
  ctx.closePath(); ctx.fill(); noglw(ctx);
}

// ── Atom canvas ───────────────────────────────────────────────────────────
function drawAtom() {
  const ac = window.__ac;
  if (!ac) return;
  const t = T();
  const aw = getAW(), ah = getAH(), cx = CX(), cy = CY();
  ac.fillStyle = t.bg; ac.fillRect(0, 0, aw, ah);
  drawGrid(ac, aw, ah); corners(ac, aw, ah, 20);

  // Orbits + n-labels
  for (let n = 1; n <= 6; n++) {
    const r = R(n), act = n === eN && ss !== 'IONIZED';
    ac.strokeStyle = act ? t.orbHi : t.orb;
    ac.lineWidth = act ? 1.5 : 1;
    ac.setLineDash([5, 5]);
    ac.beginPath(); ac.arc(cx, cy, r, 0, Math.PI * 2); ac.stroke();
    ac.setLineDash([]);
    ac.fillStyle = act ? t.eCol : t.tick;
    ac.font = 'bold 12px Courier New';
    ac.textAlign = 'left';
    ac.fillText('n=' + n, cx + r + 6, cy + 4);
  }

  // Nucleus
  const ng = ac.createRadialGradient(cx,cy,0,cx,cy,26);
  ng.addColorStop(0, dark?'rgba(255,100,0,.35)':'rgba(180,40,0,.22)');
  ng.addColorStop(1,'transparent');
  ac.fillStyle = ng; ac.beginPath(); ac.arc(cx,cy,26,0,Math.PI*2); ac.fill();
  glw(ac, t.nucGlow, 15);
  ac.fillStyle = t.nuc; ac.beginPath(); ac.arc(cx,cy,10,0,Math.PI*2); ac.fill();
  noglw(ac);
  ac.fillStyle = ss === 'IONIZED' ? (dark?'#ffaa00':'#9c5e00') : '#fff';
  ac.font = 'bold 9px Courier New';
  ac.textAlign = 'center'; ac.textBaseline = 'middle';
  ac.fillText(ss === 'IONIZED' ? 'H⁺' : 'p⁺', cx, cy);
  ac.textBaseline = 'alphabetic';

  // Electron cloud / ionization
  buildCloud(eN);
  if (ss === 'IONIZING') {
    const cloudFade = Math.max(0, 1 - ionProgress * 2.5);
    if (cloudFade > 0) drawCloudAt(ac, cx, cy, t, cloudFade);
    glw(ac, t.eCol, 16);
    ac.fillStyle = t.eCol;
    ac.beginPath(); ac.arc(ionBallX, ionBallY, 6, 0, Math.PI * 2); ac.fill();
    noglw(ac);
    ac.fillStyle = t.tx2; ac.font = 'bold 10px Courier New'; ac.textAlign = 'center';
    ac.fillText('e⁻', ionBallX, ionBallY - 10);
    ac.textAlign = 'left';
  } else if (ss === 'IONIZED') {
    const ionCol = dark ? '#ffaa00' : '#9c5e00';
    glw(ac, ionCol, 14);
    ac.fillStyle = ionCol; ac.font = 'bold 16px Courier New'; ac.textAlign = 'center';
    ac.fillText('IONISERET', cx, cy - 44);
    noglw(ac);
    ac.fillStyle = t.tx; ac.font = 'bold 11px Courier New';
    ac.fillText('Elektronen er frigjort fra atomet', cx, cy - 26);
    ac.textAlign = 'left';
  } else {
    drawCloudAt(ac, cx, cy, t, 1);
  }

  // Emission photons
  for (const p of ePh) {
    const alpha = Math.max(0, 1 - p.life / 75);
    ac.globalAlpha = alpha;
    waveArrow(ac, p.x - p.vx*28, p.y - p.vy*28, p.x, p.y, p.col, 5);
    ac.globalAlpha = 1;
  }

  // Incoming photon
  if (ss === 'SHOOTING') {
    const stopX = cx - R(startN) - 8;
    const sx = Math.max(-15, pX - 90), ex2 = Math.min(pX, stopX);
    if (ex2 > sx + 5) waveArrow(ac, sx, cy, ex2, cy, pCol);
  }
  if (ss === 'PASSING') {
    const sx = Math.max(-15, pX - 90);
    if (pX > sx + 5) waveArrow(ac, sx, cy, pX, cy, pCol);
  }

  if (flash > 0) {
    ac.fillStyle = dark ? `rgba(255,255,255,${flash})` : `rgba(255,250,235,${flash*1.1})`;
    ac.fillRect(0,0,aw,ah);
  }

  // Pause overlay
  if (paused && ss !== 'READY') {
    ac.fillStyle = dark ? 'rgba(6,14,24,.70)' : 'rgba(244,238,227,.75)';
    ac.fillRect(0, 0, aw, ah);
    glw(ac, t.ac, 18);
    ac.fillStyle = t.ac; ac.font = 'bold 20px Courier New'; ac.textAlign = 'center';
    ac.fillText('[ PAUSE ]', aw/2, ah/2);
    noglw(ac); ac.textAlign = 'left';
  }
}

// ── Energy diagram ────────────────────────────────────────────────────────
function drawEnergy() {
  const ec = window.__ec;
  if (!ec) return;
  const t = T();
  const ew = getEW(), eh = getEH();
  ec.fillStyle = t.bg; ec.fillRect(0, 0, ew, eh);
  drawGrid(ec, ew, eh); corners(ec, ew, eh, 16);

  // Title
  ec.fillStyle = t.ac; ec.font = 'bold 12px Courier New'; ec.textAlign = 'center';
  ec.fillText('ENERGINIVEAUER', ew/2, 20);
  ec.fillStyle = t.tx; ec.font = 'bold 11px Courier New';
  ec.fillText('HYDROGEN (eV)', ew/2, 33);

  // Plot bounds
  const PT = 46, PB = eh - 24, PH = PB - PT;
  const LX = 38, RX = ew - 8, MX = (LX + RX) / 2;
  const yOf = e => e2y(e, PB, PH);

  // Ionization limit
  const yInf = PT;
  ec.strokeStyle = dark ? 'rgba(142,200,216,.45)' : 'rgba(80,80,80,.55)';
  ec.setLineDash([3,5]); ec.lineWidth = 1;
  ec.beginPath(); ec.moveTo(LX, yInf); ec.lineTo(RX, yInf); ec.stroke();
  ec.setLineDash([]);
  ec.fillStyle = t.tick; ec.font = 'bold 10px Courier New'; ec.textBaseline = 'middle';
  ec.textAlign = 'right'; ec.fillText('n=∞', LX-3, yInf);
  ec.textAlign = 'right'; ec.fillText('0.00', RX, yInf - 10);
  ec.textBaseline = 'alphabetic';
  ec.fillStyle = t.dim; ec.font = 'bold 9px Courier New'; ec.textAlign = 'center';
  ec.fillText('(log skala)', ew/2, yInf + 11);

  // Energy levels n=1..6
  for (let n = 1; n <= 6; n++) {
    const e = En(n), y = yOf(e), act = n === eN && ss !== 'IONIZED';
    const hov = n === hoverN;
    ec.strokeStyle = hov ? (dark ? '#ffffff' : '#000000') : (act ? t.orbHi : t.orb);
    ec.lineWidth = hov ? 2.5 : (act ? 2 : 1);
    if (hov && dark) { ec.shadowColor = '#ffffff'; ec.shadowBlur = 8; }
    ec.beginPath(); ec.moveTo(LX, y); ec.lineTo(RX, y); ec.stroke();
    ec.shadowBlur = 0;
    ec.fillStyle = hov ? (dark ? '#ffffff' : '#000000') : (act ? t.tx2 : t.tick);
    ec.font = 'bold 12px Courier New';
    ec.textBaseline = 'middle'; ec.textAlign = 'right';
    ec.fillText('n='+n, LX-3, y);
    ec.fillStyle = hov ? (dark ? '#ffffff' : '#000000') : (act ? t.tx2 : t.tick);
    ec.font = 'bold 11px Courier New';
    ec.textBaseline = 'alphabetic'; ec.textAlign = 'right';
    ec.fillText(e.toFixed(2), RX, y - 4);
    ec.textBaseline = 'alphabetic';
  }

  // Emission arrows behind
  if (dStep > 0 && dPath.length > 1) {
    for (let i = 0; i < dStep && i < dPath.length - 1; i++) {
      const fN = dPath[i], tN = dPath[i+1];
      if (tN === undefined) break;
      const lam = HC / (En(fN) - En(tN));
      const col = wlCol(lam);
      const y1 = yOf(En(fN)), y2 = yOf(En(tN));
      const x = LX + 14 + i * 11;
      ec.strokeStyle = col; ec.lineWidth = 2;
      if (dark) ec.globalAlpha = 0.85;
      ec.beginPath(); ec.moveTo(x,y1); ec.lineTo(x,y2); ec.stroke();
      ec.fillStyle = col;
      ec.beginPath(); ec.moveTo(x,y2); ec.lineTo(x-5,y2-9); ec.lineTo(x+5,y2-9); ec.closePath(); ec.fill();
      ec.globalAlpha = 1;
      if (dark) { ec.shadowColor = col; ec.shadowBlur = 10; }
      ec.fillStyle = col; ec.font = 'bold 11px Courier New';
      ec.textBaseline = 'middle'; ec.textAlign = 'left';
      ec.fillText(lam.toFixed(0) + ' nm', x + 5, (y1 + y2) / 2);
      ec.shadowBlur = 0; ec.textBaseline = 'alphabetic';
    }
  }

  // Absorption / ionization arrow
  if ((ss === 'READY' || ss === 'SHOOTING') && dStep === 0) {
    const pE = HC / selWL;
    const y1 = yOf(En(startN));
    const isIon = pE >= ionE(startN) * 0.999;
    const y2 = isIon ? PT - 8 : yOf(En(startN) + pE);
    const ionCol = dark ? '#ffaa00' : '#9c5e00';
    const col = isIon ? ionCol : wlCol(selWL);
    const ax = MX + 20;

    ec.strokeStyle = col; ec.lineWidth = 2; ec.setLineDash([6, 3]);
    ec.beginPath(); ec.moveTo(ax, y1); ec.lineTo(ax, y2); ec.stroke();
    ec.setLineDash([]);
    ec.fillStyle = col;
    ec.beginPath(); ec.moveTo(ax,y2); ec.lineTo(ax-6,y2+10); ec.lineTo(ax+6,y2+10); ec.closePath(); ec.fill();
    if (isIon) {
      glw(ec, col, 6);
      ec.fillStyle = col; ec.font = 'bold 10px Courier New';
      ec.textBaseline = 'bottom'; ec.textAlign = 'left';
      ec.fillText('ION.', ax + 7, PT - 6);
      noglw(ec); ec.textBaseline = 'alphabetic';
    }
    glw(ec, col, 5);
    ec.fillStyle = col; ec.font = 'bold 11px Courier New';
    ec.textBaseline = 'middle'; ec.textAlign = 'left';
    ec.fillText(pE.toFixed(2) + ' eV', ax + 8, (y1 + y2) / 2);
    noglw(ec); ec.textBaseline = 'alphabetic';
  }

  // Electron dot
  if (ss === 'IONIZED') {
    const ionCol = dark ? '#ffaa00' : '#9c5e00';
    glw(ec, ionCol, 14);
    ec.fillStyle = ionCol;
    ec.beginPath(); ec.arc(MX, PT - 16, 5, 0, Math.PI*2); ec.fill();
    noglw(ec);
    ec.fillStyle = ionCol; ec.font = 'bold 11px Courier New';
    ec.textBaseline = 'middle'; ec.textAlign = 'left';
    ec.fillText('e⁻ fri', MX + 9, PT - 16);
    ec.textBaseline = 'alphabetic';
  } else {
    const edy = yOf(En(eN));
    glw(ec, t.eSh, 12);
    ec.fillStyle = t.eCol;
    ec.beginPath(); ec.arc(MX, edy, 5, 0, Math.PI*2); ec.fill();
    noglw(ec);
    ec.fillStyle = t.tx2; ec.font = 'bold 11px Courier New';
    ec.textBaseline = 'middle'; ec.textAlign = 'left';
    ec.fillText('e⁻', MX + 8, edy);
    ec.textBaseline = 'alphabetic';
  }

  // Axis label / hover hint
  ec.fillStyle = t.tx; ec.font = 'bold 11px Courier New'; ec.textAlign = 'center';
  if (hoverN !== null) {
    if (dark) { ec.shadowColor = '#ffffff'; ec.shadowBlur = 6; }
    ec.fillStyle = dark ? '#ffffff' : '#000000';
    ec.fillText(`klik for at vælge n=${hoverN}`, ew/2, eh - 8);
    ec.shadowBlur = 0;
  } else {
    ec.fillText('Energi (eV)', ew/2, eh - 8);
  }
}

// ── Spectrum panel ────────────────────────────────────────────────────────
const SPEC_LAM_MIN = 80, SPEC_LAM_MAX = 2000;
function drawSpectrum() {
  const sc = window.__sc;
  if (!sc) return;
  const sw = getSW(), sh = getSH();
  sc.fillStyle = dark ? '#000000' : '#141414';
  sc.fillRect(0, 0, sw, sh);
  const lamToX = lam => (lam - SPEC_LAM_MIN) / (SPEC_LAM_MAX - SPEC_LAM_MIN) * sw;

  // Visible window (380-700 nm)
  const vL = lamToX(380), vR = lamToX(700);
  sc.fillStyle = 'rgba(255,255,255,.07)';
  sc.fillRect(vL, 0, vR - vL, sh);
  sc.strokeStyle = 'rgba(255,255,255,.18)';
  sc.lineWidth = 1;
  sc.beginPath();
  sc.moveTo(vL, 0); sc.lineTo(vL, sh);
  sc.moveTo(vR, 0); sc.lineTo(vR, sh);
  sc.stroke();

  // Max count for normalization (sqrt scale)
  let maxCount = 1;
  for (const c of spectrum.values()) if (c > maxCount) maxCount = c;
  const maxSqrt = Math.sqrt(maxCount);

  const PLOT_TOP = 12, PLOT_BOT = sh - 11;
  const PLOT_H = PLOT_BOT - PLOT_TOP;

  // Draw lines
  for (const [lam, count] of spectrum) {
    if (lam < SPEC_LAM_MIN || lam > SPEC_LAM_MAX) continue;
    const x = lamToX(lam);
    const h = Math.max(2, (Math.sqrt(count) / maxSqrt) * PLOT_H);
    const col = wlCol(lam);
    sc.fillStyle = col;
    if (dark) { sc.shadowColor = col; sc.shadowBlur = 5; }
    sc.fillRect(x - 1, PLOT_BOT - h, 2, h);
  }
  sc.shadowBlur = 0;

  // Series labels
  sc.font = 'bold 10px Courier New';
  sc.textAlign = 'center'; sc.textBaseline = 'top';
  sc.shadowColor = 'rgba(0,0,0,.85)'; sc.shadowBlur = 3;
  sc.fillStyle = '#ffffff';
  sc.fillText('Lyman',   lamToX(122), 2);
  sc.fillText('Balmer',  lamToX(500), 2);
  sc.fillText('Paschen', lamToX(1400), 2);
  sc.shadowBlur = 0;

  // Wavelength ticks
  sc.font = 'bold 9px Courier New';
  sc.textBaseline = 'bottom';
  sc.fillStyle = '#ffffff';
  for (const lam of [100, 250, 500, 750, 1000, 1500, 2000]) {
    if (lam > SPEC_LAM_MAX) continue;
    const x = lamToX(lam);
    sc.strokeStyle = 'rgba(255,255,255,.45)';
    sc.lineWidth = 1;
    sc.beginPath(); sc.moveTo(x, sh - 9); sc.lineTo(x, sh - 4); sc.stroke();
    sc.shadowColor = 'rgba(0,0,0,.85)'; sc.shadowBlur = 3;
    sc.fillText(lam, x, sh);
    sc.shadowBlur = 0;
  }

  document.getElementById('specTag').textContent = totalPhotons + ' fotoner';
}

// ── HTML Emission log (crisp text!) ───────────────────────────────────────
const dec = (x, d) => x.toFixed(d).replace('.', ',');
function renderLog() {
  const el = document.getElementById('logArea');
  const info = document.getElementById('logStateInfo');
  if (elog.length === 0) {
    el.innerHTML = '<div class="log-empty">Ingen emissioner endnu. Vælg en resonans-bølgelængde (fx 121,6 nm for n=1→2) og tryk Afspil.</div>';
    info.textContent = '— venter';
    return;
  }
  let sumEmit = 0;
  const rows = [];
  elog.forEach(e => {
    const dE = En(e.hi) - En(e.lo);
    sumEmit += dE;
    const col = wlCol(e.lam);
    const glow = dark ? `text-shadow:0 0 8px ${col}66;` : '';
    rows.push(
      `<div class="log-line" style="color:${col};${glow}">
         <span class="log-transition">n=${e.hi}→${e.lo}:</span>
         <span class="log-energy">E = ${dec(dE,2)} eV</span>
       </div>`
    );
  });
  const parts = elog.map(e => dec(En(e.hi) - En(e.lo), 2));
  const sumExpr = parts.length === 1 ? `${parts[0]} eV` :
                  `${parts.join(' + ')} = ${dec(sumEmit, 2)} eV`;
  const complete = Math.abs(sumEmit - absorbedE) < 0.01 && ss === 'READY';
  const checkHtml = complete
    ? `<span class="log-check">✓ energibevarelse</span>` : '';
  el.innerHTML = rows.join('') +
    `<div class="log-divider"></div>
     <div class="log-sum"><span class="lbl">Σ E_emit =</span>${sumExpr}</div>
     <div class="log-sum"><span class="lbl">E_absorb. =</span>${dec(absorbedE, 2)} eV${checkHtml}</div>`;
  info.textContent = complete ? '— kaskade afsluttet' : (ss === 'DECAYING' || ss === 'EXCITED' ? '— kaskade i gang' : '— venter');
}

// ── Decay & lifetimes ─────────────────────────────────────────────────────
function randDecay(from) {
  const path = [from]; let cur = from;
  while (cur > 1) {
    const tgts=[], ws=[];
    for (let n=1; n<cur; n++) { tgts.push(n); ws.push(1/Math.pow(cur-n,1.5)); }
    const sum = ws.reduce((a,b)=>a+b,0);
    let r = Math.random()*sum, chosen = tgts[0];
    for (let i=0; i<tgts.length; i++) { r-=ws[i]; if(r<=0){chosen=tgts[i];break;} }
    path.push(chosen); cur=chosen;
  }
  return path;
}

const TAU_PHYS_NS = [0, 0, 1.6, 5.3, 12.0, 23.0, 40.0];
const TAU_BASE_FRAMES = 12;
function tauFrames(n) {
  return TAU_BASE_FRAMES * Math.sqrt(TAU_PHYS_NS[n] / TAU_PHYS_NS[2]);
}
function drawWait(n) {
  const u = Math.max(0.07, Math.random());
  return -tauFrames(n) * Math.log(u);
}

// Photon speed — CONSTANT for shooting, passing, and beyond.
// (Bug fix: earlier version had PASSING speed = 1.9× SHOOTING, giving the
// visual illusion of the atom accelerating the photon after transit.)
const SPD = 3.8;

function tick(ts) {
  const dt = Math.min((ts - lastTs) / 16.667, 3); lastTs = ts;

  // Defensive: retry canvas init if layout wasn't ready at first call.
  if (!window.__ac || !window.__ec) resizeCanvases();

  if (paused && ss !== 'READY') { drawAtom(); drawEnergy(); if (!document.getElementById('specBox').classList.contains('hide')) drawSpectrum(); requestAnimationFrame(tick); return; }

  flash = Math.max(0, flash - dt * 0.045);
  for (const p of ePh) { p.x+=p.vx*dt; p.y+=p.vy*dt; p.life+=dt; }
  ePh = ePh.filter(p => p.life < 75);
  tmr += dt;

  const aw = getAW();
  const cx = CX();

  switch (ss) {
    case 'SHOOTING':
      pX += SPD * dt;
      if (pX >= cx - R(startN) - 8) {
        if (pendingIon) {
          ss = 'IONIZING'; ionAngle = -Math.PI/2 + (Math.random()-0.5)*1.2;
          ionBallX = cx + Math.cos(ionAngle) * R(eN);
          ionBallY = CY() + Math.sin(ionAngle) * R(eN);
          ionProgress = 0; flash = 0.9; tmr = 0;
          setSt('Ionisering! — fotonen har nok energi til at frigøre elektronen.');
        } else if (matched) {
          ss = 'ABSORBING'; flash = 0.55; tmr = 0;
          setSt('Foton absorberet — resonans! Elektron exciteres.');
        } else {
          ss = 'PASSING'; tmr = 0;
          setSt('Ingen resonans — foton passerer uabsorberet igennem atomet.');
        }
      }
      break;
    case 'PASSING':
      pX += SPD * dt;  // same speed as SHOOTING — no unphysical acceleration
      if (pX > aw + 110) { ss = 'READY'; setSt('Klar.'); setPlay(false); }
      break;
    case 'ABSORBING':
      if (tmr > 20) {
        eN = tgtN; buildCloud(eN); dPath = randDecay(tgtN); dStep = 0;
        decayWait = drawWait(tgtN);
        ss = 'EXCITED'; tmr = 0;
        setSt(`Elektron i n=${tgtN} (τ ≈ ${TAU_PHYS_NS[tgtN].toFixed(1)} ns) — venter på spontant henfald...`);
        renderLog();
      }
      break;
    case 'EXCITED':
      // Update progress % periodically for pedagogical feedback
      if (Math.floor(tmr) % 12 === 0 && Math.floor(tmr) !== Math.floor(tmr - dt)) {
        const pct = Math.min(100, Math.round(tmr / decayWait * 100));
        setSt(`Elektron i n=${eN} (τ ≈ ${TAU_PHYS_NS[eN].toFixed(1)} ns) — venter på henfald... ${pct}%`);
      }
      if (tmr > decayWait) { ss = 'DECAYING'; tmr = 0; }
      break;
    case 'DECAYING':
      if (tmr > decayWait) {
        tmr = 0;
        if (dStep < dPath.length - 1) {
          const fN = dPath[dStep], tN = dPath[dStep+1];
          const lam = HC / (En(fN) - En(tN));
          elog.push({ lo:tN, hi:fN, lam });
          recordEmission(lam);
          eN = tN; buildCloud(eN); flash = 0.16; dStep++;
          decayWait = eN > 1 ? drawWait(eN) : 0;
          const ang = Math.random() * Math.PI * 2;
          ePh.push({ x:cx+R(fN)*Math.cos(ang), y:CY()+R(fN)*Math.sin(ang),
                     vx:Math.cos(ang)*2.6, vy:Math.sin(ang)*2.6, col:wlCol(lam), life:0 });
          const tag = lam<380?'UV':lam>700?'IR':'synlig';
          setSt(`Henfald n=${fN}→${tN}: λ=${lam.toFixed(0)} nm ${seriesName(tN)} (${tag}).`);
          renderLog();
        } else {
          ss = 'READY'; setPlay(false);
          setSt('Henfald afsluttet — elektronen er tilbage i grundtilstanden.');
          renderLog();
        }
      }
      break;
    case 'IONIZING':
      ionProgress = Math.min(1, ionProgress + dt * 0.013);
      ionBallX += Math.cos(ionAngle) * 5.5 * dt;
      ionBallY += Math.sin(ionAngle) * 5.5 * dt;
      if (ionProgress >= 1) {
        ss = 'IONIZED'; setPlay(false);
        setSt('Atom ioniseret — elektronen er frigjort. Klik Nulstil.');
      }
      break;
    case 'IONIZED': break;
  }

  drawAtom(); drawEnergy();
  if (!document.getElementById('specBox').classList.contains('hide')) drawSpectrum();
  requestAnimationFrame(tick);
}

// ── UI helpers ────────────────────────────────────────────────────────────
function setSt(msg) { document.getElementById('stTxt').textContent = msg; }
function setPlay(on) {
  const b = document.getElementById('playBtn');
  b.textContent = (on && !paused) ? '⏸ Pause' : '▶ Afspil';
}

function updSlider() {
  selWL = parseFloat(document.getElementById('sl').value);
  document.getElementById('wlv').textContent = selWL.toFixed(1);
  document.getElementById('ev').textContent = (HC/selWL).toFixed(2);

  const pE = HC / selWL;
  const isIon = pE >= ionE(startN) * 0.999;
  const ab = isIon ? null : findAbs(selWL);
  const badge = document.getElementById('badge');

  if (isIon) {
    badge.className = 'badge b-ion';
    badge.textContent = `Ionisering  E=${pE.toFixed(2)} > ${ionE(startN).toFixed(2)} eV`;
  } else if (ab) {
    badge.className = 'badge b-yes';
    badge.textContent = `Match: n=${startN}→${ab.hi} (${ab.lam.toFixed(1)} nm)`;
  } else {
    badge.className = 'badge b-no';
    badge.textContent = 'Ingen match';
  }
}

function doReset() {
  ss = 'READY'; eN = startN; flash = 0;
  buildCloud(startN); lastCloudN = startN;
  ePh = []; elog = []; dPath = []; dStep = 0;
  ionProgress = 0; paused = false; decayWait = 0;
  absorbedE = 0;
  setPlay(false); updSlider();
  setSt('Nulstillet — vælg bølgelængde og klik Afspil.');
  renderLog();
}

// ── Event listeners ───────────────────────────────────────────────────────
document.getElementById('sl').addEventListener('input', updSlider);

document.getElementById('nBtns').addEventListener('click', e => {
  const btn = e.target.closest('.btn-sm');
  if (!btn) return;
  document.querySelectorAll('#nBtns .btn-sm').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  startN = parseInt(btn.dataset.n);
  absTransitions = calcAbsTrans(startN);
  doReset();
});

document.getElementById('playBtn').addEventListener('click', () => {
  if (ss === 'READY' && !paused) {
    elog = []; dPath = []; dStep = 0;
    const pE = HC / selWL;
    pendingIon = pE >= ionE(startN) * 0.999;
    const ab = pendingIon ? null : findAbs(selWL);
    matched = !!ab;
    tgtN = ab ? ab.hi : startN;
    if (matched)         absorbedE = En(tgtN) - En(startN);
    else if (pendingIon) absorbedE = pE;
    else                 absorbedE = 0;
    pX = -10; pCol = wlCol(selWL);
    ss = 'SHOOTING'; tmr = 0; paused = false;
    setSt('Foton sendt mod atomet...');
    setPlay(true);
    renderLog();
  } else if (ss !== 'READY' && ss !== 'IONIZED') {
    paused = !paused; setPlay(!paused);
    if (paused) setSt('Pause — klik Afspil for at fortsætte.');
  }
});

document.getElementById('resetBtn').addEventListener('click', doReset);
document.getElementById('clearBtn').addEventListener('click', clearSpectrum);

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.documentElement.outerHTML).then(() => {
    const b = document.getElementById('copyBtn');
    const original = b.textContent;
    b.textContent = '✓ Kopieret!';
    setTimeout(() => b.textContent = original, 2200);
  });
});

document.getElementById('themeBtn').addEventListener('click', () => {
  dark = !dark;
  if (dark) document.documentElement.removeAttribute('data-theme');
  else      document.documentElement.setAttribute('data-theme','light');
  document.getElementById('themeBtn').textContent = dark ? 'Lyst tema' : 'Mørkt tema';
  updSlider();
  renderLog();
});

// Click-on-level in energy diagram
function findLevelAtY(mouseY) {
  const eh = getEH();
  const PT = 46, PB = eh - 24, PH = PB - PT;
  let bestN = null, bestDist = 12;
  for (let n = 1; n <= 6; n++) {
    const y = e2y(En(n), PB, PH);
    const d = Math.abs(mouseY - y);
    if (d < bestDist) { bestDist = d; bestN = n; }
  }
  return bestN;
}
function eEl_eventY(e) {
  const rect = eEl.getBoundingClientRect();
  return (e.clientY - rect.top) * (getEH() / rect.height);
}
eEl.addEventListener('mousemove', e => {
  const newHover = findLevelAtY(eEl_eventY(e));
  if (newHover !== hoverN) {
    hoverN = newHover;
    eEl.style.cursor = hoverN !== null ? 'pointer' : 'default';
  }
});
eEl.addEventListener('mouseleave', () => {
  if (hoverN !== null) { hoverN = null; eEl.style.cursor = 'default'; }
});
eEl.addEventListener('click', e => {
  const n = findLevelAtY(eEl_eventY(e));
  if (n === null) return;
  document.querySelectorAll('#nBtns .btn-sm').forEach(b => b.classList.toggle('active', parseInt(b.dataset.n) === n));
  startN = n;
  absTransitions = calcAbsTrans(startN);
  doReset();
});

// ── Resize handling ──────────────────────────────────────────────────────
let resizeTimer = null;
window.addEventListener('resize', () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { resizeCanvases(); }, 100);
});

// ── Init ──────────────────────────────────────────────────────────────────
resizeCanvases();
updSlider();
buildCloud(1);
renderLog();
lastTs = performance.now();
requestAnimationFrame(tick);

// Also re-init after full load (fonts, images) to catch any layout shift
window.addEventListener('load', resizeCanvases);
</script>
